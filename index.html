<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Order summary card</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>

<body>

  <main>

    <div class="container">

      <figure>
        <img src="./images/illustration-hero.svg" alt="a dancing man with headphones connected to phone" id="image" />
      </figure>

      <article>

        <header>
 
          <h1 class="text">Order Summary</h1> 
          <p class="text">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
       
        </header>

        <section>

          <div class="plan">
            <figure>
              <img src="./images/icon-music.svg" alt="a muscial note" />
            </figure>

            <p><span>Annual Plan</span><br />
            $59.99/year</p>

            <a href="#" alt="change plan">Change</a>
          </div>

        </section>

        <section>

          <a href="#"><div class="proceed-button">
            Proceed to Payment
          </div></a>

          <div class="cancel-button">
            <a href="#">Cancel Order</a>
          </div>
          
        </section>

      </article>
      
    </div>

  </main>

</body>
</html>
